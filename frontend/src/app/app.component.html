<!-- Main App Container -->
<div class="min-h-screen flex flex-col">
  <!-- Navigation Component -->
  <app-nav 
    *ngIf="shouldShowNav()"
    (onHomeClick)="onHomeClick()"
    (onLoginClick)="onLoginClick()"
    (onRegisterClick)="onRegisterClick()"
    (onOrganizationRegisterClick)="onOrganizationRegisterClick()"
    (onLogoutClick)="onLogoutClick()">
  </app-nav>

  <!-- Main Content -->
  <div class="flex-1">
    <div *ngIf="showGlobalBackButton" class="px-4 pt-4 sm:px-6 lg:px-8">
      <app-back-button></app-back-button>
    </div>
    <!-- Router Outlet for all routes -->
    <router-outlet></router-outlet>
  </div>

  <!-- Toast Container para notificaciones flotantes -->
  <app-toast-container></app-toast-container>

  <!-- Retry Indicator para mostrar estado de reintentos -->
  <app-retry-indicator></app-retry-indicator>
</div>
