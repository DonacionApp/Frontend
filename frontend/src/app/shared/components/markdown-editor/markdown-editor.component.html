<div class="border-2 border-orange-500 rounded-lg overflow-hidden bg-white transition-all focus-within:border-orange-600 focus-within:shadow-[0_0_0_4px_rgba(249,115,22,0.25)]">
  <!-- Barra de herramientas -->
  <div class="flex flex-wrap items-center gap-3 p-2 bg-gray-50 border-b border-gray-200">
    <button
      *ngFor="let btn of formatButtons"
      type="button"
      (click)="btn.action()"
      [title]="btn.tooltip"
      [disabled]="disabled"
      class="toolbar-btn flex items-center justify-center min-w-8 h-8 px-2 py-1 border border-gray-300 rounded-md bg-white cursor-pointer transition-all text-sm text-gray-700 hover:bg-gray-100 hover:border-gray-400 hover:-translate-y-0.5 active:shadow-inner disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span [innerHTML]="btn.icon" class="flex items-center justify-center"></span>
    </button>
    
    <div class="flex-1"></div>
    
    <!-- Botón de vista previa (opcional) -->
    <button
      *ngIf="showPreview"
      type="button"
      (click)="togglePreview()"
      [disabled]="disabled"
      class="toolbar-btn flex items-center justify-center min-w-8 h-8 px-2 py-1 border border-gray-300 rounded-md bg-white cursor-pointer transition-all text-sm text-gray-700 hover:bg-gray-100 hover:border-gray-400 hover:-translate-y-0.5 active:shadow-inner disabled:opacity-50 disabled:cursor-not-allowed"
      [class.bg-orange-500]="showPreviewMode"
      [class.border-orange-500]="showPreviewMode"
      [class.text-white]="showPreviewMode"
      [class.hover:bg-orange-600]="showPreviewMode"
      [title]="showPreviewMode ? 'Editar' : 'Vista previa'"
    >
      <span *ngIf="!showPreviewMode">👁️</span>
      <span *ngIf="showPreviewMode">✏️</span>
    </button>
  </div>

  <!-- Editor de texto -->
  <div *ngIf="!showPreviewMode" class="relative bg-white min-h-[400px]">
    <textarea
      #textarea
      [value]="value"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [placeholder]="placeholder"
      [rows]="rows"
      [attr.maxlength]="maxLength"
      [disabled]="disabled"
      class="w-full min-h-[400px] p-5 border-0 resize-y font-sans text-[15px] leading-[1.8] text-gray-800 bg-white outline-none caret-orange-500 placeholder:text-gray-400 placeholder:italic placeholder:text-sm disabled:cursor-not-allowed disabled:text-gray-500 disabled:bg-gray-50 disabled:opacity-70 focus:bg-gray-50"
    ></textarea>
  </div>

  <!-- Vista previa -->
  <div *ngIf="showPreviewMode" class="relative bg-white min-h-[400px] p-5 overflow-y-auto">
    <div *ngIf="previewHtml" class="markdown-body p-0 min-h-full text-gray-800" [innerHTML]="previewHtml"></div>
    <p *ngIf="!previewHtml" class="text-gray-500 text-center py-8">
      No hay contenido para previsualizar
    </p>
  </div>

  <!-- Contador de caracteres -->
  <div class="flex justify-between items-center px-3 py-2 bg-gray-50 border-t-2 border-gray-200 text-[13px]">
    <span [class]="characterCountClass">
      {{ characterCount }} / {{ maxLength }} caracteres
    </span>
    
    <div class="flex gap-3">
      <span class="text-gray-500 font-mono px-2 py-1 bg-white border border-gray-200 rounded text-xs" title="Negrita">**texto**</span>
      <span class="text-gray-500 font-mono px-2 py-1 bg-white border border-gray-200 rounded text-xs" title="Cursiva">*texto*</span>
      <span class="text-gray-500 font-mono px-2 py-1 bg-white border border-gray-200 rounded text-xs" title="Enlace">[texto](url)</span>
    </div>
  </div>
</div>
