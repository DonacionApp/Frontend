<div class="notification-toast" 
     [class]="getTypeClass()"
     [class.visible]="visible"
     (click)="onClick()"
     [class.clickable]="true"
     [style.--progress-duration]="progressDuration + 's'">
  
  <div class="toast-icon">
    <i [class]="'bi ' + getIcon()"></i>
  </div>

  <div class="toast-content">
    <div class="toast-header">
      <span class="toast-title">{{ notification.title }}</span>
      <span class="toast-time">{{ getRelativeTime() }}</span>
    </div>
    <div class="toast-message" [title]="isMessageTruncated ? notification.message : ''">
      {{ truncatedMessage }}
    </div>
    <div class="toast-footer">
      <small class="toast-hint">
        <span *ngIf="isMessageTruncated">Ver mensaje completo • </span>
        Haz clic para {{ notification.link ? 'ver más detalles' : 'ir al centro de notificaciones' }}
      </small>
    </div>
  </div>

  <button class="toast-close" (click)="close(); $event.stopPropagation()" type="button" aria-label="Cerrar notificación">
    <i class="bi bi-x"></i>
  </button>
</div>
