<div class="bg-white rounded-lg shadow-sm mb-6">
  <nav class="flex border-b border-gray-200">
    <button
      *ngFor="let tab of tabs"
      (click)="selectTab(tab.id)"
      [disabled]="!tab.enabled"
      [ngClass]="{
        'border-green-500 text-green-600': activeTab === tab.id && tab.enabled,
        'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300': activeTab !== tab.id && tab.enabled,
        'border-transparent text-gray-300 cursor-not-allowed': !tab.enabled
      }"
      class="flex items-center gap-2 px-6 py-4 text-sm font-medium border-b-2 transition-colors duration-200 relative"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="tab.icon"></path>
      </svg>
      <span>{{ tab.label }}</span>
      
      <!-- Badge "Próximamente" para tabs deshabilitadas -->
      <span 
        *ngIf="!tab.enabled" 
        class="absolute -top-2 -right-2 bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full font-normal"
      >
        Próximamente
      </span>
    </button>
  </nav>
</div>
