<aside class="w-80 bg-white border-r border-gray-200 h-screen sticky top-0 flex flex-col">
  
  <!-- Header -->
  <div class="p-4 border-b border-gray-200">
    <h2 class="text-xl font-bold text-gray-900 mb-3">DonacionApp</h2>
    
    <!-- Create Post Button -->
    <app-button 
      variant="primary" 
      size="md" 
      [fullWidth]="true"
      (btnClick)="onCreatePost()"
    >
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      Nueva Publicación
    </app-button>
  </div>

  <!-- Quick Actions -->
  <div class="p-4 border-b border-gray-200">
    <h3 class="text-sm font-semibold text-gray-500 uppercase mb-3">Accesos Rápidos</h3>
    <div class="space-y-1">
      <button 
        *ngFor="let action of quickActions"
        class="w-full flex items-center justify-between px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors text-left group"
      >
        <div class="flex items-center gap-3">
          <svg [class]="'w-5 h-5 ' + action.color" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIconPath(action.icon)"></path>
          </svg>
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">{{ action.label }}</span>
        </div>
        <span 
          *ngIf="action.count" 
          class="px-2 py-0.5 bg-green-500 text-white text-xs font-bold rounded-full"
        >
          {{ action.count }}
        </span>
      </button>
    </div>
  </div>

  <!-- Chats Section -->
  <div class="flex-1 overflow-y-auto">
    <div class="p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-gray-500 uppercase">Mensajes</h3>
        <button class="p-1 hover:bg-gray-100 rounded">
          <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
          </svg>
        </button>
      </div>

      <!-- Chat List -->
      <div class="space-y-1">
        <button 
          *ngFor="let chat of chats"
          (click)="openChat(chat.id)"
          class="w-full flex items-start gap-3 p-3 rounded-lg hover:bg-gray-50 transition-colors text-left group"
        >
          <!-- Avatar -->
          <div class="relative flex-shrink-0">
            <img 
              [src]="chat.avatar" 
              [alt]="chat.name"
              class="w-12 h-12 rounded-full object-cover"
            />
            <span 
              *ngIf="chat.online"
              class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"
            ></span>
          </div>

          <!-- Chat Info -->
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <p class="text-sm font-semibold text-gray-900 truncate">{{ chat.name }}</p>
              <span class="text-xs text-gray-500 flex-shrink-0 ml-2">{{ chat.time }}</span>
            </div>
            <div class="flex items-center justify-between">
              <p class="text-xs text-gray-600 truncate">{{ chat.lastMessage }}</p>
              <span 
                *ngIf="chat.unread > 0"
                class="ml-2 px-2 py-0.5 bg-green-500 text-white text-xs font-bold rounded-full flex-shrink-0"
              >
                {{ chat.unread }}
              </span>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-gray-200 bg-gray-50">
    <div class="flex items-center gap-3">
      <img 
        src="https://i.pravatar.cc/150?img=33" 
        alt="Usuario"
        class="w-10 h-10 rounded-full object-cover"
      />
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-900 truncate">Mi Perfil</p>
        <p class="text-xs text-gray-500">Ver configuración</p>
      </div>
      <button class="p-2 hover:bg-gray-200 rounded-lg transition-colors">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>
    </div>
  </div>

</aside>
