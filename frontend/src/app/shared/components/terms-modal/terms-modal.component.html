<div class="terms-modal">
  <!-- Header del Modal -->
  <div class="modal-header">
    <div class="header-content">
      <h1 mat-dialog-title class="modal-title">
        <span class="title-icon">📜</span>
        Términos y Condiciones
      </h1>
      <p class="modal-subtitle" *ngIf="lastUpdated">
        Última actualización: {{ lastUpdated }}
      </p>
    </div>
    <button 
      mat-icon-button 
      class="close-button" 
      (click)="close()"
      aria-label="Cerrar">
      <span class="close-icon">✕</span>
    </button>
  </div>

  <!-- Contenido del Modal -->
  <mat-dialog-content class="modal-content">
    <!-- Estado de Carga -->
    <div class="loading-container" *ngIf="loading">
      <mat-spinner diameter="50"></mat-spinner>
      <p class="loading-text">Cargando términos y condiciones...</p>
    </div>

    <!-- Estado de Error -->
    <div class="error-container" *ngIf="error && !loading">
      <div class="error-icon">⚠️</div>
      <p class="error-text">{{ error }}</p>
      <button mat-raised-button color="primary" (click)="reload()">
        🔄 Reintentar
      </button>
    </div>

    <!-- Contenido de los Términos -->
    <div 
      class="terms-content markdown-body" 
      *ngIf="!loading && !error"
      [innerHTML]="termsContent">
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator" *ngIf="!loading && !error">
      <span class="scroll-text">↓ Desplázate para leer todo</span>
    </div>
  </mat-dialog-content>

  <!-- Footer con Acciones -->
  <mat-dialog-actions class="modal-actions" *ngIf="!loading">
    <div class="actions-left">
      <button 
        mat-button 
        class="action-button"
        (click)="print()"
        title="Imprimir términos">
        🖨️ Imprimir
      </button>
      <button 
        mat-button 
        class="action-button"
        (click)="downloadAsText()"
        title="Descargar como texto">
        💾 Descargar
      </button>
    </div>
    
    <div class="actions-right">
      <button 
        mat-button 
        class="cancel-button"
        (click)="close()">
        Cerrar
      </button>
      <button 
        mat-raised-button 
        color="primary"
        class="accept-button"
        (click)="close()">
        Aceptar
      </button>
    </div>
  </mat-dialog-actions>

  <!-- Indicador de Progreso de Lectura -->
  <div class="read-progress-bar"></div>
</div>
