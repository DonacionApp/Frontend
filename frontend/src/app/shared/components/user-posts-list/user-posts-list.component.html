<div class="space-y-4">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="space-y-4">
    <div *ngFor="let i of [1,2,3]" class="bg-white rounded-lg shadow-sm p-6 animate-pulse">
      <div class="flex items-center space-x-3 mb-4">
        <div class="h-4 bg-gray-200 rounded w-1/4"></div>
      </div>
      <div class="space-y-3">
        <div class="h-4 bg-gray-200 rounded"></div>
        <div class="h-4 bg-gray-200 rounded w-5/6"></div>
        <div class="h-32 bg-gray-200 rounded"></div>
      </div>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="!isLoading && errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-6 text-center">
    <svg class="mx-auto h-12 w-12 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <p class="mt-4 text-red-600">{{ errorMessage }}</p>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && !errorMessage && posts.length === 0" class="bg-white rounded-lg shadow-sm p-12 text-center">
    <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
    </svg>
    <h3 class="mt-4 text-lg font-medium text-gray-900">No hay publicaciones</h3>
    <p class="mt-2 text-sm text-gray-500">Este usuario aún no ha creado ninguna publicación.</p>
  </div>

  <!-- Posts List -->
  <div *ngIf="!isLoading && !errorMessage && posts.length > 0" class="space-y-4">
    <div 
      *ngFor="let post of posts"
      (click)="viewPostDetails(post.id)"
      class="bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow cursor-pointer max-w-4xl mx-auto"
    >
      <!-- Post Header -->
      <div class="p-4 sm:p-6">
        <div class="flex items-center justify-between mb-4">
          <!-- Type Badge -->
          <span 
            *ngIf="post.typePost"
            [ngClass]="getTypeColor(post.typePost.type)"
            class="px-3 py-1 rounded-full text-xs font-medium"
          >
            {{ post.typePost.type }}
          </span>
          
          <!-- Date -->
          <span class="text-xs text-gray-500">
            {{ post.createdAt | date: 'dd/MM/yyyy HH:mm' }}
          </span>
        </div>

        <!-- Title -->
        <h3 class="text-xl font-semibold text-gray-900 mb-2">{{ post.title }}</h3>

        <!-- Message -->
        <p class="text-gray-700 mb-4 line-clamp-3">{{ post.message }}</p>

        <!-- Tags -->
        <div *ngIf="post.tags && post.tags.length > 0" class="flex flex-wrap gap-2 mb-4">
          <span
            *ngFor="let postTag of post.tags"
            class="px-2 py-1 bg-gray-100 text-gray-700 rounded-md text-xs font-medium"
          >
            #{{ postTag.tag.tag }}
          </span>
        </div>
      </div>

      <!-- Images -->
      <div 
        *ngIf="post.imagePost && post.imagePost.length > 0" 
        class="relative overflow-hidden rounded-b-lg"
        (click)="openImageGallery(post.imagePost, $event)"
      >
        <!-- Single Image -->
        <div *ngIf="post.imagePost.length === 1" class="relative">
          <img 
            [src]="post.imagePost[0].image" 
            [alt]="post.title"
            class="w-full h-96 object-cover"
          />
        </div>

        <!-- Two Images -->
        <div *ngIf="post.imagePost.length === 2" class="grid grid-cols-2 gap-1">
          <img 
            *ngFor="let image of post.imagePost"
            [src]="image.image" 
            [alt]="post.title"
            class="w-full h-64 object-cover"
          />
        </div>

        <!-- Three or More Images -->
        <div *ngIf="post.imagePost.length >= 3" class="grid grid-cols-2 gap-1">
          <img 
            [src]="post.imagePost[0].image" 
            [alt]="post.title"
            class="w-full h-64 object-cover col-span-2"
          />
          <img 
            [src]="post.imagePost[1].image" 
            [alt]="post.title"
            class="w-full h-48 object-cover"
          />
          <div class="relative">
            <img 
              [src]="post.imagePost[2].image" 
              [alt]="post.title"
              class="w-full h-48 object-cover"
            />
            <div 
              *ngIf="post.imagePost.length > 3"
              class="absolute inset-0 bg-black bg-opacity-60 flex items-center justify-center"
            >
              <span class="text-white text-2xl font-bold">+{{ post.imagePost.length - 3 }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-4 sm:px-6 py-4 border-t border-gray-100">
        <div class="flex items-center justify-between text-sm text-gray-500">
          <div class="flex items-center gap-4">
            <!-- Likes -->
            <div class="flex items-center gap-1">
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path>
              </svg>
              <span>{{ post.likesCount }}</span>
            </div>
          </div>
          
          <span class="text-xs">Ver más →</span>
        </div>
      </div>
    </div>
  </div>
</div>
