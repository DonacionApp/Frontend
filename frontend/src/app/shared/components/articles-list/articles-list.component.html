<div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200">
  <!-- Header -->
  <div class="p-4 border-b border-gray-200" [ngClass]="bgColorClass">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg class="w-6 h-6" [ngClass]="iconColorClass" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
        <h3 class="text-lg font-semibold text-gray-800">{{ title }}</h3>
      </div>
      <div *ngIf="hasArticles" class="flex items-center gap-2 px-3 py-1 rounded-full text-sm font-medium"
           [ngClass]="bgColorClass + ' ' + iconColorClass">
        <span>Total: {{ totalQuantity }}</span>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="p-4">
    <!-- Empty state -->
    <div *ngIf="!hasArticles" class="text-center py-8">
      <svg class="w-16 h-16 mx-auto text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
      </svg>
      <p class="text-gray-500">{{ emptyMessage }}</p>
    </div>

    <!-- Articles list -->
    <div *ngIf="hasArticles" class="space-y-2">
      <div *ngFor="let article of articles; let i = index" 
           class="flex items-center justify-between p-3 rounded-lg transition-all duration-200 hover:shadow-sm"
           [ngClass]="i % 2 === 0 ? 'bg-gray-50' : 'bg-white'">
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold"
               [ngClass]="bgColorClass + ' ' + iconColorClass + ' ' + borderColorClass + ' border'">
            {{ i + 1 }}
          </div>
          <span class="text-gray-800 font-medium truncate">{{ article.articleName }}</span>
        </div>
        <div class="flex-shrink-0 flex items-center gap-2 ml-4">
          <span class="text-sm text-gray-500">Cantidad:</span>
          <span class="px-3 py-1 rounded-full text-sm font-bold" 
                [ngClass]="bgColorClass + ' ' + iconColorClass">
            {{ article.quantity }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer with count -->
  <div *ngIf="hasArticles" class="px-4 py-3 bg-gray-50 border-t border-gray-200">
    <p class="text-sm text-gray-600 text-center">
      <span class="font-semibold">{{ articles.length }}</span> 
      {{ articles.length === 1 ? 'tipo de artículo' : 'tipos de artículos' }}
    </p>
  </div>
</div>
