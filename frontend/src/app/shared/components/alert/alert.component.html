<!-- Backdrop -->
<div 
  *ngIf="isVisible"
  class="fixed inset-0 bg-black bg-opacity-50 z-[9999] flex items-center justify-center p-4 transition-opacity duration-300"
  (click)="onCancel()"
>
  <!-- Alert Modal -->
  <div 
    class="bg-white rounded-lg shadow-xl max-w-md w-full transform transition-all duration-300 scale-100"
    (click)="$event.stopPropagation()"
  >
    <!-- Content -->
    <div class="p-6">
      <!-- Icon -->
      <div class="flex items-center justify-center mb-4">
        <div *ngIf="!isLoading" [class]="getIconColor() + ' w-16 h-16'">
          <svg class="w-full h-full" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="getIcon()"></path>
          </svg>
        </div>
        
        <!-- Loading Spinner -->
        <div *ngIf="isLoading" class="w-16 h-16">
          <svg class="animate-spin h-full w-full text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
      </div>

      <!-- Title -->
      <h3 class="text-xl font-semibold text-gray-900 text-center mb-3">
        {{ config?.title }}
      </h3>

      <!-- Message -->
      <div class="text-sm text-gray-600 text-center" [innerHTML]="config?.message"></div>
    </div>

    <!-- Actions -->
    <div *ngIf="!isLoading" class="bg-gray-50 px-6 py-4 flex flex-col-reverse sm:flex-row gap-3 sm:gap-2 justify-end rounded-b-lg">
      <!-- Cancel Button -->
      <button
        *ngIf="config?.showCancelButton"
        type="button"
        (click)="onCancel()"
        class="w-full sm:w-auto px-6 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
        [ngClass]="{
          'bg-gray-500 hover:bg-gray-600 text-white focus:ring-gray-500': !config?.cancelButtonColor,
          'text-white': config?.cancelButtonColor
        }"
        [ngStyle]="config?.cancelButtonColor ? {'background-color': config?.cancelButtonColor} : {}"
      >
        {{ config?.cancelButtonText || 'Cancelar' }}
      </button>

      <!-- Confirm Button -->
      <button
        type="button"
        (click)="onConfirm()"
        class="w-full sm:w-auto px-6 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
        [ngClass]="{
          'bg-red-500 hover:bg-red-600 text-white focus:ring-red-500': config?.type === 'warning' && !config?.confirmButtonColor,
          'bg-green-500 hover:bg-green-600 text-white focus:ring-green-500': config?.type === 'success' && !config?.confirmButtonColor,
          'bg-blue-500 hover:bg-blue-600 text-white focus:ring-blue-500': (config?.type === 'info' || config?.type === 'error') && !config?.confirmButtonColor,
          'text-white': config?.confirmButtonColor
        }"
        [ngStyle]="config?.confirmButtonColor ? {'background-color': config?.confirmButtonColor} : {}"
      >
        {{ config?.confirmButtonText || 'Aceptar' }}
      </button>
    </div>
  </div>
</div>
