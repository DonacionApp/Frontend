<article class="bg-white rounded-lg shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden border border-gray-200 mb-4" 
         role="article"
         [attr.aria-label]="'Publicación de ' + username">
  <!-- Header estilo Facebook -->
  <header class="px-4 py-3 border-b border-gray-200 bg-white">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- Foto de perfil estilo Facebook - Mejorada -->
        <div class="relative flex-shrink-0">
          <img
            [src]="profilePhotoUrl"
            [alt]="username"
            class="w-12 h-12 rounded-full object-cover border-2 border-gray-100 shadow-sm"
            (error)="$any($event.target).src = getDefaultAvatar()"
            loading="lazy"
          />
          <!-- Indicador de estado (opcional) -->
          <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 rounded-full border-2 border-white"></div>
        </div>
        
        <!-- Información del usuario estilo Facebook -->
        <div class="flex-1">
          <h3 
            class="font-semibold text-gray-900 text-[15px] cursor-pointer hover:underline"
            (click)="onUserClick($event)"
          >
            {{ username }}
          </h3>
          <div class="flex items-center text-xs text-gray-500 mt-0.5">
            <span>{{ formatTimeAgo(donation.createdAt) }}</span>
            <span class="mx-1">·</span>
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Menú de opciones estilo Facebook -->
      <button class="p-1.5 rounded-full hover:bg-gray-100 transition-colors">
        <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Contenido estilo Facebook -->
  <div class="px-4 pt-3 pb-2">
    <!-- Título y descripción estilo Facebook -->
    <div *ngIf="donation.title" class="mb-2">
      <h2 class="text-[15px] font-semibold text-gray-900 leading-snug mb-1">
        {{ donation.title }}
      </h2>
    </div>
    
    <div *ngIf="donation.description" class="text-[15px] text-gray-900 leading-normal mb-3">
      {{ donation.description }}
    </div>
    
    <!-- Tags generadas por IA estilo Facebook -->
    <div *ngIf="donation.tags && donation.tags.length > 0" class="mb-3 flex flex-wrap gap-1.5">
      <span 
        *ngFor="let tag of donation.tags" 
        class="inline-flex items-center px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-xs font-medium hover:bg-blue-200 transition-colors cursor-pointer"
      >
        #{{ tag.tag || tag.name || tag }}
      </span>
    </div>

    <!-- Imagen principal estilo Facebook -->
    <div *ngIf="firstImage" class="mb-3 -mx-4 cursor-pointer" (click)="onCardClick()">
      <img 
        [src]="firstImage" 
        [alt]="donation.title || 'Imagen de la publicación'"
        class="w-full max-h-[500px] object-cover"
        (error)="onImageError($event)"
        (load)="onImageLoad($event)"
        loading="lazy"
      />
    </div>
  </div>

  <!-- Footer estilo Facebook -->
  <footer *ngIf="showActions" class="px-4 py-2 border-t border-gray-200">
    <!-- Botones de acción estilo Facebook -->
    <div class="flex items-center justify-between border-t border-gray-200 pt-1 mt-1">
      <!-- Botón Me gusta -->
      <button
        (click)="onLikeToggle()"
        [disabled]="isLikeInProgress"
        class="flex-1 flex items-center justify-center px-2 py-2 rounded-lg transition-colors hover:bg-gray-100"
        [class.text-emerald-600]="donation.isLikedByCurrentUser"
        [class.text-gray-500]="!donation.isLikedByCurrentUser"
        [class.bg-emerald-50]="donation.isLikedByCurrentUser"
        [class.opacity-60]="isLikeInProgress"
        [attr.aria-pressed]="donation.isLikedByCurrentUser"
        [attr.title]="donation.isLikedByCurrentUser ? 'Quitar me gusta' : 'Dar me gusta'"
      >
        <div class="flex items-center gap-2">
          <ng-container *ngIf="isLikeInProgress; else likeIcon">
            <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle class="opacity-25" cx="12" cy="12" r="10"></circle>
              <path class="opacity-75" d="M4 12a8 8 0 018-8" stroke-linecap="round"></path>
            </svg>
          </ng-container>
          <ng-template #likeIcon>
            <svg class="w-5 h-5 transition-all"
                 [attr.fill]="donation.isLikedByCurrentUser ? 'currentColor' : 'none'"
                 [attr.stroke]="donation.isLikedByCurrentUser ? 'none' : 'currentColor'"
                 stroke-width="2"
                 viewBox="0 0 24 24">
              <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
          </ng-template>

          <span class="text-[15px] font-medium">
            {{ donation.isLikedByCurrentUser ? 'Ya has dado like' : 'Me gusta' }}
          </span>

          <span
            *ngIf="(donation.likesCount || 0) > 0"
            class="text-[13px] font-semibold text-gray-600 bg-gray-100 px-2 py-0.5 rounded-full">
            {{ donation.likesCount }}
          </span>
        </div>
      </button>

      <!-- Botón Detalles (siempre visible) -->
      <button 
        (click)="onCardClick()"
        class="flex-1 flex items-center justify-center space-x-2 px-2 py-2 rounded-lg transition-colors hover:bg-gray-100 text-gray-600"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-[15px] font-medium">Detalles</span>
      </button>

      <!-- Botones para ORGANIZACIÓN (solo si es dueño) -->
      <ng-container *ngIf="isOrganization && isOwner">
        <!-- Botón Editar -->
        <button 
          *ngIf="canEdit"
          (click)="onEditClick($event)"
          class="flex-1 flex items-center justify-center space-x-2 px-2 py-2 rounded-lg transition-colors hover:bg-gray-100 text-gray-500"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
          <span class="text-[15px] font-medium">Editar</span>
        </button>

        <!-- Botón Eliminar -->
        <button 
          *ngIf="canDelete"
          (click)="onDeleteClick($event)"
          class="flex-1 flex items-center justify-center space-x-2 px-2 py-2 rounded-lg transition-colors hover:bg-gray-100 text-red-600"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          <span class="text-[15px] font-medium">Eliminar</span>
        </button>
      </ng-container>

      <!-- Botón Donar para DONADOR -->
      <button 
        *ngIf="canDonate"
        (click)="onDonateClick($event)"
        class="flex-1 flex items-center justify-center space-x-2 px-2 py-2 rounded-lg transition-colors hover:bg-gray-100 text-emerald-600"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        <span class="text-[15px] font-medium">Donar</span>
      </button>
    </div>
  </footer>

  <app-likes-modal
    *ngIf="donation?.id"
    [isOpen]="showLikesModal"
    [donationId]="donation.id"
    [likesCount]="donation.likesCount || 0"
    (onClose)="showLikesModal = false"
  ></app-likes-modal>
</article>
