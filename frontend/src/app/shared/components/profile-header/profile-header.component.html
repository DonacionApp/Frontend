<div class="bg-white rounded-lg shadow-sm p-6 mb-6">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="animate-pulse">
    <div class="flex items-center space-x-4">
      <div class="w-24 h-24 bg-gray-200 rounded-full"></div>
      <div class="flex-1 space-y-4">
        <div class="h-6 bg-gray-200 rounded w-1/4"></div>
        <div class="h-4 bg-gray-200 rounded w-1/2"></div>
      </div>
    </div>
  </div>

  <!-- User Info -->
  <div *ngIf="!isLoading && user" class="flex flex-col sm:flex-row items-center sm:items-start gap-6">
    <!-- Profile Photo -->
    <div class="relative">
      <img 
        [src]="user.profilePhoto" 
        [alt]="user.username"
        class="w-24 h-24 rounded-full object-cover border-4 border-gray-100"
      />
      <!-- Verification Badges -->
      <div class="absolute -bottom-2 -right-2 flex gap-1">
        <div 
          *ngIf="user.emailVerified"
          class="bg-blue-500 rounded-full p-1.5 shadow-md"
          title="Email verificado"
        >
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
          </svg>
        </div>
        <div 
          *ngIf="user.verified"
          class="bg-green-500 rounded-full p-1.5 shadow-md"
          title="Usuario verificado"
        >
          <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- User Details -->
    <div class="flex-1 text-center sm:text-left">
      <div class="flex items-center justify-center sm:justify-start gap-2 mb-2">
        <h1 class="text-2xl font-bold text-gray-900">{{ user.username }}</h1>
      </div>
      
      <!-- Stats -->
      <div class="flex items-center justify-center sm:justify-start gap-6 text-sm text-gray-600 mb-3">
        <div class="flex flex-col items-center sm:items-start">
          <span class="text-xl font-semibold text-gray-900">{{ postsCount }}</span>
          <span class="text-xs text-gray-500">Publicaciones</span>
        </div>
        <!-- Aquí puedes agregar más stats en el futuro -->
      </div>

      <!-- Member Since -->
      <p class="text-sm text-gray-500">
        <span class="font-medium">Miembro desde:</span> 
        {{ user.createdAt | date: 'MMMM yyyy' }}
      </p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="!isLoading && !user" class="text-center py-8">
    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
    </svg>
    <p class="mt-4 text-gray-600">No se pudo cargar la información del usuario</p>
  </div>
</div>
