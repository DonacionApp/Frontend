<!-- Header -->
<header class="bg-white shadow-sm border-b border-gray-200 animate-slide-in-top">
  <div class="max-w-full sm:max-w-screen-sm md:max-w-screen-md lg:max-w-screen-lg xl:max-w-screen-xl 2xl:max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-14 sm:h-16">
      <!-- Logo -->
      <div class="flex items-center flex-shrink-0">
        <button (click)="onHomeClick()" class="flex items-center hover:opacity-80 transition-all duration-300 hover:scale-105">
          <svg class="w-6 h-6 sm:w-7 sm:h-7 md:w-8 md:h-8 text-green-500 mr-1.5 sm:mr-2 animate-pulse-slow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span class="text-base sm:text-lg md:text-xl font-bold text-green-500">DonacionApp</span>
        </button>
      </div>
      
      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-1 md:space-x-2 lg:space-x-3 xl:space-x-4">
        <!-- Navigation for non-authenticated users -->
        <ng-container *ngIf="!isAuthenticated">
          <button 
            (click)="onPostsClick()"
            class="text-gray-700 hover:text-green-600 px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-all duration-300 hover:scale-105 whitespace-nowrap">
            Publicaciones
          </button>
          
          <button 
            (click)="onOrganizationsClick()"
            class="text-gray-700 hover:text-green-600 px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-all duration-300 hover:scale-105 whitespace-nowrap">
            Organizaciones
          </button>
          
          <button 
            (click)="onAboutClick()"
            class="text-gray-700 hover:text-green-600 px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-all duration-300 hover:scale-105 whitespace-nowrap">
            Acerca de
          </button>

          <button 
            (click)="onHelpClick()"
            class="text-gray-700 hover:text-green-600 px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-all duration-300 hover:scale-105 whitespace-nowrap">
            Ayuda
          </button>
          
          <button 
            (click)="onLoginClick()"
            class="text-gray-700 hover:text-green-600 px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-all duration-300 hover:scale-105 whitespace-nowrap">
            Iniciar Sesión
          </button>
          
          <button 
            (click)="onRegisterClick()"
            class="bg-orange-500 hover:bg-orange-600 text-white px-2 lg:px-4 py-2 text-xs lg:text-sm font-medium rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-lg whitespace-nowrap">
            Registrarse
          </button>
        
        </ng-container>

        <!-- Navigation for authenticated users -->
        <ng-container *ngIf="isAuthenticated">
          <!-- Menu items for authenticated users -->
          <button 
            (click)="onPostsClick()"
            class="text-gray-700 hover:text-green-600 px-1.5 md:px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-colors flex items-center group">
            <svg class="w-4 h-4 md:w-5 md:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="ml-1 hidden xl:inline whitespace-nowrap">Publicaciones</span>
            <span class="ml-1 hidden lg:inline xl:hidden text-[10px] whitespace-nowrap">Posts</span>
          </button>
          <!-- Dashboard para organizaciones, Mis Donaciones para donantes -->
          <button 
            (click)="onMyDonationsClick()"
            class="text-gray-700 hover:text-green-600 px-1.5 md:px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-colors flex items-center group">
            <!-- Icono Dashboard para organizaciones (cuadrícula/panel) -->
            <svg *ngIf="user?.role === 'organization'" class="w-4 h-4 md:w-5 md:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <!-- Icono Donaciones para donantes -->
            <svg *ngIf="user?.role === 'donor'" class="w-4 h-4 md:w-5 md:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
            </svg>
            <span class="ml-1 hidden xl:inline whitespace-nowrap">
              {{ user?.role === 'organization' ? 'Dashboard' : 'Mis Donaciones' }}
            </span>
            <span class="ml-1 hidden lg:inline xl:hidden text-[10px] whitespace-nowrap">
              {{ user?.role === 'organization' ? 'Dashboard' : 'Donaciones' }}
            </span>
          </button>
          <button 
            *ngIf="user?.role === 'organization'"
            (click)="onReceivedItemsClick()"
            class="text-gray-700 hover:text-green-600 px-1.5 md:px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-colors flex items-center group">
            <svg class="w-4 h-4 md:w-5 md:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
            </svg>
            <span class="ml-1 hidden xl:inline whitespace-nowrap">donaciones Recibidos</span>
            <span class="ml-1 hidden lg:inline xl:hidden text-[10px] whitespace-nowrap">Recibidos</span>
          </button>
          <button
            (click)="onOrganizationsClick()"
            class="text-gray-700 hover:text-green-600 px-1.5 md:px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-colors flex items-center group">
            <svg class="w-4 h-4 md:w-5 md:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            <span class="ml-1 hidden lg:inline whitespace-nowrap">Organizaciones</span>
          </button>
          <button 
            (click)="onMessagesClick()"
            class="text-gray-700 hover:text-green-600 px-1.5 md:px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-colors flex items-center relative group">
            <svg class="w-4 h-4 md:w-5 md:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            <span class="ml-1 hidden lg:inline whitespace-nowrap">Mensajes</span>
          </button>
          <div class="relative notifications-dropdown-container">
            <button
              (click)="onNotificationsClick()"
              [attr.aria-expanded]="showNotificationsDropdown"
              aria-haspopup="true"
              class="text-gray-700 hover:text-green-600 px-1.5 md:px-2 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-colors flex items-center relative group"
              [class.text-green-600]="showNotificationsDropdown">
              <svg class="w-4 h-4 md:w-5 md:h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
              <span class="ml-1 hidden lg:inline whitespace-nowrap">Notificaciones</span>
              <span *ngIf="unreadNotificationsCount > 0"
                    class="absolute top-1 -right-3 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
                {{ unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount }}
              </span>
            </button>

            <div
              *ngIf="showNotificationsDropdown"
              class="notifications-dropdown-panel absolute right-0 mt-2 w-[calc(100vw-2rem)] max-w-sm sm:w-80 bg-white rounded-xl shadow-xl border border-gray-200 z-50 overflow-hidden">

              <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between gap-2 bg-green-50">
                <h3 class="text-sm font-semibold text-gray-900">Notificaciones</h3>
                <button
                  *ngIf="unreadNotificationsCount > 0"
                  (click)="markAllPreviewAsRead($event)"
                  class="text-xs font-medium text-green-700 hover:text-green-800 hover:underline whitespace-nowrap">
                  Marcar todas como leídas
                </button>
              </div>

              <div class="max-h-80 overflow-y-auto divide-y divide-gray-100">
                <div
                  *ngFor="let notification of previewNotifications"
                  class="flex items-start gap-2 pr-2 hover:bg-gray-50 transition-colors"
                  [class.bg-green-50]="!notification.read">
                  <button
                    type="button"
                    (click)="onPreviewNotificationClick(notification)"
                    class="flex-1 min-w-0 text-left pl-4 py-3 flex items-start gap-3 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-500 rounded-lg">
                    <span class="mt-1.5 flex-shrink-0 w-2 h-2 rounded-full"
                          [class.bg-green-500]="!notification.read"
                          [class.bg-gray-300]="notification.read"></span>
                    <span class="flex-1 min-w-0">
                      <span class="block text-sm font-medium text-gray-900 truncate">{{ notification.title }}</span>
                      <span class="block text-xs text-gray-500 mt-0.5 line-clamp-2">{{ notification.message }}</span>
                      <span class="block text-[11px] text-gray-400 mt-1">{{ notification.createdAt | date:'short' }}</span>
                    </span>
                  </button>
                  <button
                    *ngIf="!notification.read"
                    type="button"
                    (click)="markPreviewAsRead(notification, $event)"
                    [attr.aria-label]="'Marcar como leída: ' + notification.title"
                    title="Marcar como leída"
                    class="flex-shrink-0 mt-3 text-green-600 hover:text-green-800 p-1 rounded hover:bg-green-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                  </button>
                </div>

                <div *ngIf="previewNotifications.length === 0" class="px-4 py-8 text-center">
                  <svg class="w-10 h-10 mx-auto text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                  </svg>
                  <p class="text-sm text-gray-500">No tienes notificaciones nuevas</p>
                </div>
              </div>

              <div class="border-t border-gray-100 p-2">
                <button
                  (click)="goToNotificationsCenter()"
                  class="w-full text-center text-sm font-semibold text-green-600 hover:text-white hover:bg-green-500 py-2 rounded-lg transition-colors">
                  Ver todas las notificaciones
                </button>
              </div>
            </div>
          </div>
          <button 
            (click)="onStatisticsClick()"
            class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <span class="ml-1 hidden lg:inline whitespace-nowrap">Estadísticas</span>
          </button>

          <button 
            (click)="onHelpClick()"
            class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="ml-1 hidden lg:inline whitespace-nowrap">Ayuda</span>
          </button>
          
          <div class="flex items-center ml-2 lg:ml-4">
            <!-- User Menu Dropdown -->
            <div class="relative group">
              <button class="flex items-center space-x-1 lg:space-x-2 text-gray-700 hover:text-green-600 px-1.5 lg:px-3 py-2 text-xs lg:text-sm font-medium transition-colors">
                <!-- Avatar con imagen o inicial -->
                <div class="relative flex-shrink-0">
                  <div *ngIf="userProfileImage" class="w-7 h-7 lg:w-8 lg:h-8 rounded-full overflow-hidden border-2 border-green-500">
                    <img [src]="userProfileImage" [alt]="displayName" class="w-full h-full object-cover">
                  </div>
                  <div *ngIf="!userProfileImage" class="w-7 h-7 lg:w-8 lg:h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold text-sm">
                    {{ userInitial }}
                  </div>
                  
                  <!-- Badge de verificación sobre el avatar -->
                  <div 
                    *ngIf="isAuthenticated && !isDocumentVerified"
                    (click)="onVerificationBadgeClick(); $event.stopPropagation()"
                    class="absolute -bottom-0.5 -right-0.5 w-4 h-4 lg:w-5 lg:h-5 bg-yellow-400 border-2 border-white rounded-full flex items-center justify-center cursor-pointer hover:bg-yellow-500 transition-colors group/badge">
                    <svg class="w-2.5 h-2.5 lg:w-3 lg:h-3 text-white animate-pulse" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                    <!-- Tooltip para badge -->
                    <div class="absolute bottom-full mb-2 left-1/2 transform -translate-x-1/2 px-3 py-2 bg-gray-900 text-white text-xs rounded-lg opacity-0 invisible group-hover/badge:opacity-100 group-hover/badge:visible transition-all duration-200 whitespace-nowrap z-50 pointer-events-none">
                      Cuenta sin verificar. Click para completar
                      <div class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-1">
                        <div class="border-4 border-transparent border-t-gray-900"></div>
                      </div>
                    </div>
                  </div>

                  <div 
                    *ngIf="isAuthenticated && isDocumentVerified"
                    class="absolute -bottom-0.5 -right-0.5 w-4 h-4 lg:w-5 lg:h-5 bg-green-500 border-2 border-white rounded-full flex items-center justify-center group/badge">
                    <svg class="w-2.5 h-2.5 lg:w-3 lg:h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                    <!-- Tooltip para verificado -->
                    <div class="absolute bottom-full mb-2 left-1/2 transform -translate-x-1/2 px-3 py-2 bg-gray-900 text-white text-xs rounded-lg opacity-0 invisible group-hover/badge:opacity-100 group-hover/badge:visible transition-all duration-200 whitespace-nowrap z-50 pointer-events-none">
                      Cuenta verificada ✓
                      <div class="absolute top-full left-1/2 transform -translate-x-1/2 -mt-1">
                        <div class="border-4 border-transparent border-t-gray-900"></div>
                      </div>
                    </div>
                  </div>
                </div>
                
                <span class="hidden xl:inline truncate max-w-[120px]">{{ displayName }}</span>
                <svg class="w-3 h-3 lg:w-4 lg:h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              
              <!-- Dropdown Menu -->
              <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
                <!-- Mostrar "Mi Perfil" solo si NO estamos en la página de perfil -->
                <button 
                  *ngIf="!isOnProfilePage"
                  (click)="onProfileClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  Mi Perfil
                </button>
                <hr *ngIf="!isOnProfilePage" class="my-1">
                <button 
                  (click)="onLogoutClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100 transition-colors">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                  </svg>
                  Cerrar Sesión
                </button>
              </div>
            </div>
          </div>
        </ng-container>
      </nav>
      
      <!-- Mobile menu button -->
      <div class="md:hidden flex items-center">
        <button 
          type="button" 
          class="mobile-menu-button bg-gray-100 inline-flex items-center justify-center p-1.5 sm:p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500 transition-colors"
          (click)="toggleMobileMenu()">
          <span class="sr-only">Open main menu</span>
          <svg class="h-5 w-5 sm:h-6 sm:w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Mobile Navigation -->
    <div class="mobile-menu md:hidden transition-all duration-300 ease-in-out overflow-hidden" [class.hidden]="!isMobileMenuOpen">
      <div class="px-3 sm:px-4 pt-2 pb-3 space-y-1 bg-white border-t border-gray-200 shadow-inner">
        <!-- Mobile Navigation for non-authenticated users -->
        <ng-container *ngIf="!isAuthenticated">
          <button 
            (click)="onPostsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 block px-3 py-2.5 text-sm font-medium w-full text-left transition-all duration-200 rounded-md">
            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            Publicaciones
          </button>
          
          <button 
            (click)="onOrganizationsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 block px-3 py-2.5 text-sm font-medium w-full text-left transition-all duration-200 rounded-md">
            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            Organizaciones
          </button>
          
          <button 
            (click)="onAboutClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 block px-3 py-2.5 text-sm font-medium w-full text-left transition-all duration-200 rounded-md">
            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Acerca de
          </button>

          <button 
            (click)="onHelpClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 block px-3 py-2.5 text-sm font-medium w-full text-left transition-all duration-200 rounded-md">
            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Ayuda
          </button>
          
          <button 
            (click)="onLoginClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 block px-3 py-2.5 text-sm font-medium w-full text-left transition-all duration-200 rounded-md">
            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
            Iniciar Sesión
          </button>
          
          <button 
            (click)="onRegisterClick()"
            class="bg-orange-500 hover:bg-orange-600 text-white block px-3 py-2.5 text-sm font-medium w-full rounded-md transition-all duration-200 hover:shadow-md">
            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
            Registrarse
          </button>
          
          <button 
            (click)="onOrganizationRegisterClick()"
            class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 block px-3 py-2.5 text-sm font-medium w-full rounded-md transition-all duration-200 hover:shadow-sm">
            <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            Organización
          </button>
        </ng-container>

        <!-- Mobile Navigation for authenticated users -->
        <ng-container *ngIf="isAuthenticated">
          <div class="px-3 py-3 text-sm text-gray-500 border-b border-gray-200 bg-gray-50 rounded-md mb-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <!-- Avatar con imagen o inicial -->
                <div class="relative flex-shrink-0">
                  <div *ngIf="userProfileImage" class="w-11 h-11 rounded-full overflow-hidden border-2 border-green-500 shadow-sm">
                    <img [src]="userProfileImage" [alt]="displayName" class="w-full h-full object-cover">
                  </div>
                  <div *ngIf="!userProfileImage" class="w-11 h-11 rounded-full bg-green-500 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                    {{ userInitial }}
                  </div>
                  
                  <!-- Badge de verificación en mobile -->
                  <div 
                    *ngIf="!isDocumentVerified"
                    (click)="onVerificationBadgeClick()"
                    class="absolute -bottom-1 -right-1 w-6 h-6 bg-yellow-400 border-2 border-white rounded-full flex items-center justify-center cursor-pointer hover:bg-yellow-500 active:scale-95 transition-all">
                    <svg class="w-3.5 h-3.5 text-white animate-pulse" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                    </svg>
                  </div>

                  <div 
                    *ngIf="isDocumentVerified"
                    class="absolute -bottom-1 -right-1 w-6 h-6 bg-green-500 border-2 border-white rounded-full flex items-center justify-center shadow-sm">
                    <svg class="w-3.5 h-3.5 text-white" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                  </div>
                </div>
                
                <div class="flex-1 min-w-0">
                  <p class="font-semibold text-gray-900 text-base truncate">{{ displayName }}</p>
                  <button 
                    *ngIf="!isDocumentVerified"
                    (click)="onVerificationBadgeClick()"
                    class="text-xs text-yellow-600 hover:text-yellow-700 font-medium flex items-center mt-0.5 active:scale-95 transition-transform">
                    <span class="animate-pulse mr-1">⚠</span>
                    Toca para verificar cuenta
                  </button>
                  <p class="text-xs text-green-600 font-medium flex items-center mt-0.5" *ngIf="isDocumentVerified">
                    <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                    Verificado
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Menu items optimizados para mobile -->
          <button 
            (click)="onPostsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span>Publicaciones</span>
          </button>
          <button 
            (click)="onMyDonationsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left">
            <!-- Icono Dashboard para organizaciones (cuadrícula/panel) -->
            <svg *ngIf="user?.role === 'organization'" class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <!-- Icono Donaciones para donantes -->
            <svg *ngIf="user?.role === 'donor'" class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
            </svg>
            <span>{{ user?.role === 'organization' ? 'Dashboard' : 'Mis Donaciones' }}</span>
          </button>
          <button 
            *ngIf="user?.role === 'organization'"
            (click)="onReceivedItemsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
            </svg>
            <span>Artículos Recibidos</span>
          </button>
          <button 
            (click)="onOrganizationsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            <span>Organizaciones</span>
          </button>
          <button 
            (click)="onMessagesClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left relative">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            <span>Mensajes</span>
          </button>
          <button
            (click)="onMobileNotificationsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left relative">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span>Notificaciones</span>
            <span *ngIf="unreadNotificationsCount > 0" 
                  class="ml-auto bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center flex-shrink-0">
              {{ unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount }}
            </span>
          </button>
          <button 
            (click)="onStatisticsClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            <span>Estadísticas</span>
          </button>

          <button 
            (click)="onHelpClick()"
            class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium rounded-md transition-all w-full text-left">
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Ayuda</span>
          </button>

          <div class="border-t border-gray-200 pt-2 mt-2">
            <!-- Mostrar "Mi Perfil" solo si NO estamos en la página de perfil -->
            <button 
              *ngIf="!isOnProfilePage"
              (click)="onProfileClick()"
              class="text-gray-700 hover:text-green-600 hover:bg-gray-50 flex items-center px-3 py-2.5 text-sm font-medium w-full rounded-md transition-all">
              <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              <span>Mi Perfil</span>
            </button>
            <button 
              (click)="onLogoutClick()" 
              class="text-red-600 hover:text-red-700 hover:bg-red-50 flex items-center px-3 py-2.5 text-sm font-medium w-full rounded-md transition-all">
              <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              <span>Cerrar Sesión</span>
            </button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</header>
