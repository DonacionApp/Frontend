<!-- Header -->
<header class="bg-white shadow-sm border-b border-gray-200 animate-slide-in-top">
  <div class="max-w-6xl xl:max-w-7xl 2xl:max-w-8xl mx-auto px-0 sm:px-0 md:px-1 lg:px-1 xl:px-1 2xl:px-2">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <button (click)="onHomeClick()" class="flex items-center hover:opacity-80 transition-all duration-300 hover:scale-105">
          <svg class="w-8 h-8 text-green-500 mr-2 animate-pulse-slow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span class="text-xl font-bold text-green-500">DonacionApp</span>
        </button>
      </div>
      
      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-8">
        <!-- Navigation for non-authenticated users -->
        <ng-container *ngIf="!isAuthenticated">
          <button 
            (click)="onAboutClick()"
            class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-all duration-300 hover:scale-105">
            Acerca de
          </button>
          
          <button 
            (click)="onLoginClick()"
            class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-all duration-300 hover:scale-105">
            Iniciar Sesión
          </button>
          
          <button 
            (click)="onRegisterClick()"
            class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 text-sm font-medium rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-lg">
            Registrarse
          </button>
        
        </ng-container>

        <!-- Navigation for authenticated users -->
        <ng-container *ngIf="isAuthenticated">
          <div class="flex items-center space-x-4">
            <!-- User Menu Dropdown -->
            <div class="relative group">
              <button class="flex items-center space-x-2 text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors">
                <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold">
                  {{ user && user.name ? user.name.charAt(0).toUpperCase() : 'U' }}
                </div>
                <span>{{ user?.name || 'Usuario' }}</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              
              <!-- Dropdown Menu -->
              <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
                <button 
                  (click)="onProfileClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  Mi Perfil
                </button>
                <hr class="my-1">
                <button 
                  (click)="onLogoutClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                  </svg>
                  Cerrar Sesión
                </button>
              </div>
            </div>
          </div>
        </ng-container>
      </nav>
      
      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button 
          type="button" 
          class="mobile-menu-button bg-gray-100 inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
          (click)="toggleMobileMenu()">
          <span class="sr-only">Open main menu</span>
          <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Mobile Navigation -->
    <div class="mobile-menu md:hidden transition-all duration-300 ease-in-out" [class.hidden]="!isMobileMenuOpen">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-white border-t border-gray-200">
        <!-- Mobile Navigation for non-authenticated users -->
        <ng-container *ngIf="!isAuthenticated">
          <button 
            (click)="onAboutClick()"
            class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium w-full text-left transition-all duration-300 hover:scale-105">
            Acerca de
          </button>
          
          <button 
            (click)="onLoginClick()"
            class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium w-full text-left transition-all duration-300 hover:scale-105">
            Iniciar Sesión
          </button>
          
          <button 
            (click)="onRegisterClick()"
            class="bg-orange-500 hover:bg-orange-600 text-white block px-3 py-2 text-base font-medium w-full rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-lg">
            Registrarse
          </button>
          
          <button 
            (click)="onOrganizationRegisterClick()"
            class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 block px-3 py-2 text-base font-medium w-full rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-md">
            Organización
          </button>
        </ng-container>

        <!-- Mobile Navigation for authenticated users -->
        <ng-container *ngIf="isAuthenticated">
          <div class="px-3 py-2 text-sm text-gray-500 border-b border-gray-200">
            <div class="flex items-center space-x-2">
              <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold">
                {{ user && user.name ? user.name.charAt(0).toUpperCase() : 'U' }}
              </div>
              <span>{{ user?.name || 'Usuario' }}</span>
            </div>
          </div>
          <button 
            (click)="onProfileClick()"
            class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium w-full text-left">
            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Mi Perfil
          </button>
          <button 
            (click)="onLogoutClick()" 
            class="text-gray-700 hover:text-red-600 block px-3 py-2 text-base font-medium w-full text-left">
            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Cerrar Sesión
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</header>
