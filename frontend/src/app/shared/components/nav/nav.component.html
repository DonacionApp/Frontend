<!-- Header -->
<header class="bg-white shadow-sm border-b border-gray-200 animate-slide-in-top">
  <div class="max-w-6xl xl:max-w-7xl 2xl:max-w-8xl mx-auto px-0 sm:px-0 md:px-1 lg:px-1 xl:px-1 2xl:px-2">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <button (click)="onHomeClick()" class="flex items-center hover:opacity-80 transition-all duration-300 hover:scale-105">
          <svg class="w-8 h-8 text-green-500 mr-2 animate-pulse-slow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span class="text-xl font-bold text-green-500">DonacionApp</span>
        </button>
      </div>
      
      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-8">
        <!-- Navigation for non-authenticated users -->
        <ng-container *ngIf="!isAuthenticated">
          <button 
            (click)="onAboutClick()"
            class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-all duration-300 hover:scale-105">
            Acerca de
          </button>
          
          <button 
            (click)="onLoginClick()"
            class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-all duration-300 hover:scale-105">
            Iniciar Sesión
          </button>
          
          <button 
            (click)="onRegisterClick()"
            class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 text-sm font-medium rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-lg">
            Registrarse
          </button>
        
        </ng-container>

        <!-- Navigation for authenticated users -->
        <ng-container *ngIf="isAuthenticated">
          <!-- Publicaciones - Visible para organizaciones y donantes autenticados -->
          <button 
            *ngIf="user?.role === 'organization' || user?.role === 'donor'"
            (click)="onPublicationsClick()"
            class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-all duration-300 hover:scale-105 flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
            </svg>
            Publicaciones
          </button>
          
          <!-- Menu items for authenticated users (similar to Figma) -->
          <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            Mis Donaciones
          </a>
          <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
            Donar Artículo
          </a>
          <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            Organizaciones
          </a>
          <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center relative">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
            </svg>
            Mensajes
          </a>
          <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center relative">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            Notificaciones
            <span class="absolute top-1 right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">3</span>
          </a>
          <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors flex items-center">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
            Estadísticas
          </a>
          
          <div class="flex items-center space-x-4">
            <!-- User Menu Dropdown -->
            <div class="relative group">
              <button class="flex items-center space-x-2 text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors">
                <!-- Avatar con imagen o inicial -->
                <div *ngIf="userProfileImage" class="w-8 h-8 rounded-full overflow-hidden border-2 border-green-500">
                  <img [src]="userProfileImage" [alt]="displayName" class="w-full h-full object-cover">
                </div>
                <div *ngIf="!userProfileImage" class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold">
                  {{ userInitial }}
                </div>
                <span>{{ displayName }}</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </button>
              
              <!-- Dropdown Menu -->
              <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
                <!-- Mostrar "Mi Perfil" solo si NO estamos en la página de perfil -->
                <button 
                  *ngIf="!isOnProfilePage"
                  (click)="onProfileClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                  Mi Perfil
                </button>
                <hr *ngIf="!isOnProfilePage" class="my-1">
                <button 
                  (click)="onLogoutClick()"
                  class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100">
                  <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                  </svg>
                  Cerrar Sesión
                </button>
              </div>
            </div>
          </div>
        </ng-container>
      </nav>
      
      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button 
          type="button" 
          class="mobile-menu-button bg-gray-100 inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
          (click)="toggleMobileMenu()">
          <span class="sr-only">Open main menu</span>
          <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Mobile Navigation -->
    <div class="mobile-menu md:hidden transition-all duration-300 ease-in-out" [class.hidden]="!isMobileMenuOpen">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-white border-t border-gray-200">
        <!-- Mobile Navigation for non-authenticated users -->
        <ng-container *ngIf="!isAuthenticated">
          <button 
            (click)="onAboutClick()"
            class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium w-full text-left transition-all duration-300 hover:scale-105">
            Acerca de
          </button>
          
          <button 
            (click)="onLoginClick()"
            class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium w-full text-left transition-all duration-300 hover:scale-105">
            Iniciar Sesión
          </button>
          
          <button 
            (click)="onRegisterClick()"
            class="bg-orange-500 hover:bg-orange-600 text-white block px-3 py-2 text-base font-medium w-full rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-lg">
            Registrarse
          </button>
          
          <button 
            (click)="onOrganizationRegisterClick()"
            class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 block px-3 py-2 text-base font-medium w-full rounded-lg transition-all duration-300 hover:scale-105 hover:shadow-md">
            Organización
          </button>
        </ng-container>

        <!-- Mobile Navigation for authenticated users -->
        <ng-container *ngIf="isAuthenticated">
          <!-- Publicaciones - Visible para organizaciones y donantes en mobile -->
          <button 
            *ngIf="user?.role === 'organization' || user?.role === 'donor'"
            (click)="onPublicationsClick()"
            class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium w-full text-left transition-all duration-300 hover:scale-105 flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
            </svg>
            Publicaciones
          </button>
          
          <div class="px-3 py-2 text-sm text-gray-500 border-b border-gray-200">
            <div class="flex items-center space-x-2">
              <!-- Avatar con imagen o inicial -->
              <div *ngIf="userProfileImage" class="w-8 h-8 rounded-full overflow-hidden border-2 border-green-500">
                <img [src]="userProfileImage" [alt]="displayName" class="w-full h-full object-cover">
              </div>
              <div *ngIf="!userProfileImage" class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-bold">
                {{ userInitial }}
              </div>
              <span>{{ displayName }}</span>
            </div>
          </div>
          <!-- Mostrar "Mi Perfil" solo si NO estamos en la página de perfil -->
          <button 
            *ngIf="!isOnProfilePage"
            (click)="onProfileClick()"
            class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium w-full text-left">
            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Mi Perfil
          </button>
          <button 
            (click)="onLogoutClick()" 
            class="text-gray-700 hover:text-red-600 block px-3 py-2 text-base font-medium w-full text-left">
            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Cerrar Sesión
          </button>
        </ng-container>
      </div>
    </div>
  </div>
</header>
