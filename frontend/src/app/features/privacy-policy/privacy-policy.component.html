<div class="privacy-policy-page">
  <!-- Header -->
  <div class="header-section">
    <div class="header-content">
      <div class="icon-container">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <div class="header-text">
        <h1>Política de Privacidad</h1>
        <p>y Protección de Datos Personales - Versión 2025</p>
      </div>
    </div>
  </div>

  <!-- Content Container -->
  <div class="content-container">
    <!-- Skeleton Loader -->
    <div *ngIf="loading" class="skeleton-loader">
      <div class="skeleton-header"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error && !loading" class="error-container">
      <div class="error-icon">
        <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      <h2>No pudimos cargar la política de privacidad</h2>
      <p class="error-message">{{ error }}</p>
      <div class="error-actions">
        <button type="button" (click)="loadPolicy()" class="retry-button">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
          Intentar nuevamente
        </button>
      </div>
    </div>

    <!-- Policy Content -->
    <div *ngIf="!loading && !error" class="policy-content markdown-content">
      <div [innerHTML]="policyContent"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer-section">
    <p class="footer-text">
      <svg class="footer-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
      </svg>
      Cumple con Ley 1581 de 2012
    </p>
  </div>
</div>
