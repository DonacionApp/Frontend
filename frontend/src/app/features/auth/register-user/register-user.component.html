<main class="min-h-[70vh] bg-gray-50 py-12">
	<div class="max-w-3xl mx-auto px-4">
		<div class="bg-white rounded-lg shadow-md overflow-hidden">
			<div class="p-8">
				<h1 class="text-2xl font-bold text-center">Crear Cuenta</h1>
				<p class="text-center text-gray-500 mt-2">Únete a nuestra comunidad de donantes y organizaciones</p>

				<div class="mt-6 grid grid-cols-1 gap-6">
					<!-- Card -->
					<div class="border border-gray-200 rounded-lg p-6">
						<!-- Account type toggle -->
						<div class="flex items-center justify-center mb-4">
							<div class="bg-gray-100 rounded-full p-1 flex items-center">
								<button class="px-4 py-2 rounded-full text-sm bg-white shadow-sm">Donante</button>
								<button class="px-4 py-2 rounded-full text-sm text-gray-600">Organización</button>
							</div>
						</div>

						<div class="md:flex md:gap-6">
							<!-- Left info box -->
							<div class="md:w-1/3 bg-gray-50 border border-gray-100 rounded-lg p-4 text-sm text-gray-600">
								<p class="font-semibold text-gray-700 mb-2">Como Donante Podrás:</p>
								<ul class="list-disc pl-5 space-y-1">
									<li>Publicar artículos que deseas donar</li>
									<li>Recibir solicitudes de organizaciones</li>
									<li>Comunicarte directamente con organizaciones</li>
									<li>Hacer seguimiento de tus donaciones</li>
								</ul>
							</div>

							<!-- Form area -->
							<div class="md:flex-1 mt-4 md:mt-0">
								<form class="space-y-4">
									<div>
										<label class="block text-sm font-medium text-gray-700">Nombre Completo *</label>
										<input type="text" placeholder="Tu nombre completo" class="mt-1 block w-full rounded-md border border-gray-200 p-2 text-sm bg-white" />
									</div>

									<div>
										<label class="block text-sm font-medium text-gray-700">Correo Electrónico *</label>
										<input type="email" placeholder="tu@email.com" class="mt-1 block w-full rounded-md border border-gray-200 p-2 text-sm bg-white" />
									</div>

									<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
										<div>
											<label class="block text-sm font-medium text-gray-700">Contraseña *</label>
											<input type="password" placeholder="Mínimo 8 caracteres" class="mt-1 block w-full rounded-md border border-gray-200 p-2 text-sm bg-white" />
										</div>
										<div>
											<label class="block text-sm font-medium text-gray-700">Confirmar Contraseña *</label>
											<input type="password" placeholder="Confirma tu contraseña" class="mt-1 block w-full rounded-md border border-gray-200 p-2 text-sm bg-white" />
										</div>
									</div>

									<div>
										<label class="block text-sm font-medium text-gray-700">Teléfono *</label>
										<input type="tel" placeholder="Tu número de teléfono" class="mt-1 block w-full rounded-md border border-gray-200 p-2 text-sm bg-white" />
									</div>

									<div>
										<label class="block text-sm font-medium text-gray-700">Dirección *</label>
										<input type="text" placeholder="Tu dirección completa" class="mt-1 block w-full rounded-md border border-gray-200 p-2 text-sm bg-white" />
									</div>

									<div class="flex items-center gap-3">
										<input id="terms" type="checkbox" class="h-4 w-4 text-green-500 rounded" />
										<label for="terms" class="text-sm text-gray-600">Acepto los <a class="text-green-500 underline">términos y condiciones</a> y la <a class="text-green-500 underline">política de privacidad</a></label>
									</div>

									<!-- Buttons -->
									<div class="flex gap-3 justify-end mt-2">
										<app-button variant="ghost" size="md">Ya tengo cuenta</app-button>
										<app-button variant="primary" size="md">Crear Cuenta</app-button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</main>

<app-footer></app-footer>
