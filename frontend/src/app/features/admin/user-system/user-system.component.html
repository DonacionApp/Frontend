<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Usuarios que Aceptaron Términos y Condiciones</h1>
      <p class="text-sm text-gray-600 mt-1">Lista de usuarios que han aceptado los términos y condiciones del sistema</p>
    </div>
    <button
      (click)="toggleFilters()"
      class="inline-flex items-center gap-2 px-4 py-2 bg-gray-100 text-gray-700 text-sm font-medium rounded-md hover:bg-gray-200 transition-colors"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
      </svg>
      {{ showFilters ? 'Ocultar' : 'Mostrar' }} Filtros
    </button>
  </div>

  <!-- Filtros -->
  <div *ngIf="showFilters" class="bg-white rounded-lg shadow-md p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Filtros de Búsqueda</h2>
    <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Límite -->
        <div>
          <label for="limit" class="block text-sm font-medium text-gray-700 mb-1">
            Límite de Resultados
          </label>
          <input
            type="number"
            id="limit"
            formControlName="limit"
            min="1"
            max="100"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            placeholder="20"
          />
        </div>

        <!-- Búsqueda -->
        <div>
          <label for="search" class="block text-sm font-medium text-gray-700 mb-1">
            Buscar
          </label>
          <input
            type="text"
            id="search"
            formControlName="search"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            placeholder="Usuario, email, nombre..."
          />
        </div>

        <!-- Rol -->
        <div>
          <label for="role" class="block text-sm font-medium text-gray-700 mb-1">
            Rol
          </label>
          <select
            id="role"
            formControlName="role"
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          >
            <option value="">Todos los roles</option>
            <option value="admin">Administrador</option>
            <option value="user">Usuario</option>
            <option value="organizacion">Organización</option>
            <option value="donor">Donante</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="clearFilters()"
          class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
        >
          Limpiar
        </button>
        <button
          type="submit"
          [disabled]="loading"
          class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Aplicar Filtros
        </button>
      </div>
    </form>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md">
    {{ errorMessage }}
  </div>

  <!-- Data Table -->
  <app-data-table
    [columns]="columns"
    [data]="users"
    [loading]="loading"
    [searchable]="false"
    [selectable]="false"
    [actions]="actions"
    emptyMessage="No hay usuarios que hayan aceptado los términos y condiciones"
  ></app-data-table>

  <!-- Botón Cargar Más (Paginación) -->
  <div *ngIf="hasMore && !loading" class="flex justify-center">
    <button
      (click)="loadMore()"
      class="px-6 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
    >
      Cargar Más
    </button>
  </div>

  <!-- Loading More Indicator -->
  <div *ngIf="loading && users.length > 0" class="flex justify-center py-4">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
    <span class="ml-2 text-gray-600">Cargando más usuarios...</span>
  </div>

  <!-- Modal de Detalles -->
  <app-details-modal
    [isOpen]="showDetailsModal"
    [title]="'Detalles del Usuario'"
    [details]="userDetails"
    (onClose)="closeDetailsModal()"
  ></app-details-modal>

  <!-- Modal de Mensaje -->
  <app-message-modal
    *ngIf="messageModalConfig"
    [isOpen]="showMessageModal"
    [title]="messageModalConfig.title"
    [message]="messageModalConfig.message"
    [type]="messageModalConfig.type"
    (onClose)="closeMessageModal()"
  ></app-message-modal>
</div>
