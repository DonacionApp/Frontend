<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Gestión de Artículos</h1>
      <p class="text-sm text-gray-600 mt-1">Administra los artículos del sistema</p>
    </div>
    <button
      (click)="openCreateModal()"
      class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 flex items-center gap-2"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Crear Artículo
    </button>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md">
    {{ errorMessage }}
  </div>

  <!-- Data Table -->
  <app-data-table
    [columns]="columns"
    [data]="articles"
    [loading]="loading"
    [searchable]="true"
    [selectable]="true"
    [actions]="actions"
    [batchActions]="batchActions"
    searchPlaceholder="Buscar artículos..."
    emptyMessage="No hay artículos registrados"
    (batchActionExecuted)="onBatchActionExecuted($event)"
  ></app-data-table>
</div>

<!-- Modal de Crear/Editar Artículo -->
<app-modal
  [isOpen]="showModal"
  [title]="isEditMode ? 'Editar Artículo' : 'Crear Artículo'"
  [size]="'lg'"
  (onClose)="closeModal()"
>
  <form [formGroup]="articleForm" (ngSubmit)="saveArticle()">
    <div class="space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
          Nombre <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          [class.border-red-500]="articleForm.get('name')?.invalid && articleForm.get('name')?.touched"
          placeholder="Nombre del artículo"
        />
        <p *ngIf="articleForm.get('name')?.invalid && articleForm.get('name')?.touched" class="mt-1 text-sm text-red-600">
          El nombre es requerido y debe tener al menos 2 caracteres
        </p>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
          Descripción
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          placeholder="Descripción del artículo (opcional)"
        ></textarea>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        (click)="closeModal()"
        class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="articleForm.invalid || saving"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ saving ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
      </button>
    </div>
  </form>
</app-modal>
