<div class="flex min-h-screen bg-gray-50">
  <!-- Sidebar - Hidden on mobile, visible on lg+ -->
  <div class="hidden lg:block">
    <app-sidebar (createPost)="handleCreatePost()"></app-sidebar>
  </div>

  <!-- Main Content -->
  <div class="flex-1 py-4 lg:py-8">
    <div class="max-w-5xl mx-auto px-2 sm:px-4 lg:px-8">
      
      <!-- Back Button -->
      <button
        (click)="goBack()"
        class="flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span class="font-medium">Volver</span>
      </button>

      <!-- Profile Header -->
      <app-profile-header
        [user]="user"
        [postsCount]="posts.length"
        [isLoading]="isLoadingUser"
      ></app-profile-header>

      <!-- Profile Tabs -->
      <app-profile-tabs
        [activeTab]="activeTab"
        (tabChange)="onTabChange($event)"
      ></app-profile-tabs>

      <!-- Content Based on Active Tab -->
      <div [ngSwitch]="activeTab">
        <!-- Posts Tab -->
        <div *ngSwitchCase="'posts'">
          <app-user-posts-list
            [posts]="posts"
            [isLoading]="isLoadingPosts"
            [errorMessage]="errorMessage"
          ></app-user-posts-list>
        </div>

        <!-- Donations Tab -->
        <div *ngSwitchCase="'donations'">
          <app-user-donations-list
            [donations]="donations"
            [isLoading]="isLoadingDonations"
            [errorMessage]="errorMessage"
          ></app-user-donations-list>
        </div>

        <!-- Stats Tab (Coming Soon) -->
        <div *ngSwitchCase="'stats'">
          <div class="bg-white rounded-lg shadow-sm p-12 text-center">
            <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            <h3 class="mt-4 text-lg font-medium text-gray-900">Estadísticas</h3>
            <p class="mt-2 text-sm text-gray-500">Esta sección estará disponible próximamente.</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
