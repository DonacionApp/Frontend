<div class="flex min-h-screen bg-gray-50">
  <!-- Sidebar - Hidden on mobile, visible on lg+ -->
  <div class="hidden lg:block">
    <app-sidebar (createPost)="handleCreatePost()"></app-sidebar>
  </div>

  <!-- Main Content -->
  <div class="flex-1 py-4 lg:py-8">
    <div class="max-w-5xl mx-auto px-2 sm:px-4 lg:px-8">
      
      <!-- Back Button -->
      <button
        (click)="goBack()"
        class="flex items-center gap-2 text-gray-600 hover:text-gray-900 mb-4 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span class="font-medium">Volver</span>
      </button>

      <!-- Profile Header -->
      <app-profile-header
        [user]="user"
        [minimal]="minimalUser"
        [postsCount]="posts.length"
        [donationsCount]="donations.length"
        [isLoading]="isLoadingUser"
      ></app-profile-header>

      <!-- Profile Tabs -->
      <app-profile-tabs
        [activeTab]="activeTab"
        (tabChange)="onTabChange($event)"
        [showLocation]="!!minimalUser?.location"
      ></app-profile-tabs>

      <!-- Content Based on Active Tab -->
      <div [ngSwitch]="activeTab">
        <!-- Posts Tab -->
        <div *ngSwitchCase="'posts'">
          <app-user-posts-list
            [posts]="posts"
            [isLoading]="isLoadingPosts"
            [errorMessage]="errorMessage"
          ></app-user-posts-list>
        </div>

        <!-- Donations Tab -->
        <div *ngSwitchCase="'donations'">
          <app-user-donations-list
            [donations]="donations"
            [isLoading]="isLoadingDonations"
            [errorMessage]="errorMessage"
          ></app-user-donations-list>
        </div>

        <!-- Stats Tab (Coming Soon) -->
        <div *ngSwitchCase="'stats'">
          <app-public-stats-view [userId]="userId"></app-public-stats-view>
        </div>
        <!-- Location Tab -->
        <div *ngSwitchCase="'location'">
          <div class="bg-white rounded-lg shadow-sm p-6 text-center">
            <div *ngIf="minimalUser?.location; else noLoc">
              <app-location-map
                [location]="minimalUser?.location"
                [mapId]="env.mapsMapId"
                [apiKey]="env.apiKeyGoogleMaps"
                [zoom]="14"
              ></app-location-map>
              <p class="mt-2 text-sm text-gray-700">Ubicación: {{ minimalUser?.location?.lat }}, {{ minimalUser?.location?.lng }}</p>
            </div>
            <ng-template #noLoc>
              <p class="text-sm text-red-600">Aún no hay ubicación para este usuario.</p>
            </ng-template>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
