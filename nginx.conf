server {
  listen 4200;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Deshabilitar logs de acceso para mejor rendimiento
  access_log off;
  error_log /var/log/nginx/error.log warn;

  # Headers de seguridad (solo para HTML)
  add_header 'X-Content-Type-Options' 'nosniff' always;
  add_header 'X-Frame-Options' 'SAMEORIGIN' always;
  add_header 'X-XSS-Protection' '1; mode=block' always;

  # Configuración de cache para assets estáticos
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Serve files, fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Configuración para archivos de configuración y otros
  location ~* \.(json|txt)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
