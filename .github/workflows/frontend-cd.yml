name: CD Frontend (Angular a Cloud Run)

on:
  workflow_call:
    inputs: {}
    secrets:
      GCP_SA_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true
      PROD_API_URL:
        required: true
      PROD_SOCKET_URL:
        required: true
      GOOGLE_MAPS_API_KEY:
        required: true
      GOOGLE_MAPS_MAP_ID:
        required: true

jobs:
  deploy_frontend:
    name: Despliegue a Producción (Cloud Run)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # 1. AUTENTICACIÓN GCP
      - name: Autenticación en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar GCloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          
      # 2. CONSTRUCCIÓN Y ALMACENAMIENTO DE LA IMAGEN DOCKER
      - name: Construir y Empujar Imagen a Artifact Registry
        run: |
          # Configura Docker para autenticarse en Artifact Registry de us-central1
          gcloud --quiet auth configure-docker us-central1-docker.pkg.dev
          
          IMAGE_URL=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/frontend-repo-donarapp/angular-app:latest
          echo "Building image: $IMAGE_URL"
          
          # Construye la imagen desde la raíz usando el Dockerfile que está en la raíz
          # Pasa las variables de entorno como build args
          docker build \
            --build-arg API_URL=${{ secrets.PROD_API_URL }} \
            --build-arg SOCKET_URL=${{ secrets.PROD_SOCKET_URL }} \
            --build-arg API_KEY_GOOGLE_MAPS=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --build-arg MAPS_MAP_ID=${{ secrets.GOOGLE_MAPS_MAP_ID }} \
            -f ../Dockerfile \
            -t $IMAGE_URL \
            ..
          
          docker push $IMAGE_URL

      # 3. DESPLIEGUE A CLOUD RUN
      - name: Desplegar a Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: donaapp-angular-frontend
          region: us-central1
          
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/frontend-repo-donarapp/angular-app:latest
          
          # Configuración del servicio
          flags: --allow-unauthenticated --timeout=300s --memory=512Mi --cpu=1 --min-instances=0 --max-instances=3
          
          # Variables de entorno (aunque Angular las tiene en build-time, 
          # las incluimos por si acaso se necesitan en runtime)
          env_vars: |
            NODE_ENV=production
