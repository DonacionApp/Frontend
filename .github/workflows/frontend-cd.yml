name: CD-Frontend (Deploy to Cloud Run)

on:
  workflow_call:
    secrets:
      GCP_PROJECT_ID:
        required: true
        description: 'Google Cloud Project ID'
      GCP_SA_KEY:
        required: true
        description: 'Google Cloud Service Account Key'
      PROD_API_URL:
        required: true
        description: 'Production API URL'
      PROD_SOCKET_URL:
        required: true
        description: 'Production Socket URL'
      GOOGLE_MAPS_API_KEY:
        required: true
        description: 'Google Maps API Key'
      GOOGLE_MAPS_MAP_ID:
        required: true
        description: 'Google Maps Map ID'

jobs:
  deploy-to-cloud-run:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      SERVICE_NAME: donaapp-angular-frontend
      REGISTRY_NAME: frontend-repo-donarapp
      
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build y Push de imagen Docker
        run: |
          docker build \
            --build-arg API_URL=${{ secrets.PROD_API_URL }} \
            --build-arg SOCKET_URL=${{ secrets.PROD_SOCKET_URL }} \
            --build-arg GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            --build-arg GOOGLE_MAPS_MAP_ID=${{ secrets.GOOGLE_MAPS_MAP_ID }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REGISTRY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REGISTRY_NAME }}/${{ env.SERVICE_NAME }}:latest \
            .
          
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REGISTRY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REGISTRY_NAME }}/${{ env.SERVICE_NAME }}:latest

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REGISTRY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 80

      - name: Verificación del despliegue
        run: echo "✅ Frontend desplegado exitosamente en Cloud Run"